name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Node version
        id: node-version
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (api)
        run: npm run typecheck --workspace=apps/api

      - name: Typecheck (web)
        run: npm run typecheck --workspace=apps/web

      - name: Test with coverage
        run: npm run test:cov
        env:
          # Placeholder value only: unit tests mock the repository interfaces
          # and never open a real connection, so no live Mongo/Atlas cluster
          # is needed in CI.
          MONGODB_URI: mongodb://localhost:27017/ci-placeholder

      - name: Build
        run: npm run build
