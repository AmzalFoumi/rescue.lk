# https://lefthook.dev — installed via `npm install -D lefthook` at the repo root.
# The npm package's own postinstall script runs `lefthook install` automatically,
# so anyone who clones and runs `npm install` gets these hooks active — no extra
# manual step needed.

pre-commit:
  parallel: true
  commands:
    api-lint:
      root: 'apps/api/'
      glob: '*.ts'
      run: npx prettier --write {staged_files} && npx oxlint {staged_files}
      stage_fixed: true
    web-lint:
      root: 'apps/web/'
      glob: '*.{ts,tsx}'
      run: npx prettier --write {staged_files} && npx eslint --fix {staged_files}
      stage_fixed: true
    shared-format:
      root: 'packages/shared/'
      glob: '*.ts'
      run: npx prettier --write {staged_files}
      stage_fixed: true
    root-format:
      glob: '*.{json,md,yml,yaml}'
      run: npx prettier --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}
